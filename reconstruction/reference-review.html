<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真如寺｜参考摄影 × 三维校准台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ee;color:#27352e;font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 28px;background:#fff;border-bottom:1px solid #cdd9cf}h1{font-size:clamp(20px,3vw,29px);font-weight:500;margin:0}p{color:#65756a;margin:5px 0 0;font-size:13px}a{color:#315f4a}main{padding:20px;max-width:1500px;margin:auto}.tools{display:flex;gap:8px;margin-bottom:14px}button{border:1px solid #c0cbc2;border-radius:22px;background:#fff;color:#365243;padding:8px 14px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#29513d;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #50906a;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{overflow:hidden;border:1px solid #cfd9d2;border-radius:13px;background:white}.panel-head{padding:12px 14px;border-bottom:1px solid #dce5de;font-size:12px;letter-spacing:.07em}.visual{height:min(60vw,570px);min-height:280px;background:#d8dfda}.visual img{height:100%;width:100%;object-fit:contain}.visual iframe{height:100%;width:100%;border:0;display:block}.hint{padding:12px;font-size:12px;color:#718075}.review{background:#fff;padding:18px;border:1px solid #cfd9d2;border-radius:13px;margin-top:14px}.review label{display:inline-flex;gap:7px;align-items:center;margin:10px 18px 10px 0;font-size:13px}.review textarea{display:block;width:100%;min-height:80px;padding:12px;border:1px solid #ced8d0;border-radius:10px;font:inherit}.actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:12px}@media(max-width:800px){header{padding:16px;display:block}.grid{grid-template-columns:1fr}.visual{height:400px}main{padding:12px}}</style></head><body><header><div><h1>参考摄影 × 实时三维</h1><p>img2threejs 式人工质量门禁 · 先检查轮廓，再批准材质和微细部。</p></div><a href="../index.html">返回建筑档案 →</a></header><main><div class="tools"><button data-view="eaves" aria-pressed="true">檐口 / 外观</button><button data-view="interior" aria-pressed="false">殿内 / 木构</button></div><div class="grid"><section class="panel"><div class="panel-head">01 / 参考照片 <span id="caption">外檐</span></div><div class="visual"><img id="photo" src="../assets/hall-eaves.jpg" alt="真如寺实地参考照片"></div><div class="hint">单张照片有相机透视与遮挡，不能自动推导结构尺寸。</div></section><section class="panel"><div class="panel-head">02 / 可交互 Three.js 模型</div><div class="visual"><iframe title="真如寺三维建筑互动场景" src="../index.html?viewerOnly=1"></iframe></div><div class="hint">拖动右侧模型至相近角度；人工比对轮廓、出檐、瓦件、斗栱。</div></section></div><section class="review"><strong>本轮人工审核</strong><div id="checks"><label><input type="checkbox" value="silhouette">整体轮廓</label><label><input type="checkbox" value="roof">屋顶与起翘</label><label><input type="checkbox" value="tile">瓦作节奏</label><label><input type="checkbox" value="bracket">斗栱节点</label><label><input type="checkbox" value="evidence">证据分级</label></div><textarea id="notes" placeholder="记录具体不匹配的部位和改进建议（需人工观察后填写）" aria-label="评审意见"></textarea><div class="actions"><p>导出的 JSON 仍标记 PENDING，须由审核者补充截图并签字后才算通过。</p><button id="download">导出评审 JSON</button></div></section></main><script>
let view="eaves";
const data={eaves:["../assets/hall-eaves.jpg","外檐"],interior:["../assets/temple-interior.jpg","殿内"]};
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelector("#photo").src=data[view][0];document.querySelector("#caption").textContent=data[view][1];document.querySelectorAll("[data-view]").forEach(c=>c.setAttribute("aria-pressed",String(c===b)))}));
document.querySelector("#download").addEventListener("click",()=>{const gates=Object.fromEntries([...document.querySelectorAll("#checks input")].map(x=>[x.value,x.checked]));const result={view,reviewDate:new Date().toISOString(),gates,notes:document.querySelector("#notes").value,status:"PENDING_HUMAN_REVIEW",renderScreenshot:null};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="zhenru-"+view+"-review.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
