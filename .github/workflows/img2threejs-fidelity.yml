name: img2threejs reference intake and structure gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hall-model.js'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/courtyard-ink.svg'
      - 'reconstruction/ginkgo-study.js'
      - 'scripts/check-ginkgo-story.mjs'
      - 'model-fidelity.js'
      - 'reconstruction/**'
      - 'presence/**'
      - 'audio/**'
      - 'server/**'
      - 'scripts/check-roof-parameters.mjs'
      - 'scripts/check-bracket-layout.mjs'
      - 'scripts/check-eave-layout.mjs'
      - 'reconstruction/eave-details.js'
      - 'scripts/check-hip-gable-topology.mjs'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/check-model-fidelity.mjs'
      - '.github/workflows/img2threejs-fidelity.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and geometry contracts
        run: |
          node --check hall-model.js
          node --check app.js
          node --check reconstruction/ginkgo-study.js
          node --check reconstruction/visit-courtyard.js
          node scripts/check-leaf-presence.mjs
          node --check reconstruction/visitor-figures.js
          node --check presence/client.js
          node --check presence/config.js
          node --check audio/quiet-air.js
          node --check server/presence-server.mjs
          node scripts/check-ginkgo-story.mjs
          node --check model-fidelity.js
          node scripts/check-model-fidelity.mjs
          node scripts/check-roof-parameters.mjs
          node scripts/check-hip-gable-topology.mjs
          node scripts/check-bracket-layout.mjs
          node scripts/check-eave-layout.mjs
          node --check reconstruction/eave-details.js
      - name: Fetch upstream img2threejs at pinned v2.0.1
        run: git clone --quiet --depth 1 --branch v2.0.1 https://github.com/img2threejs/img2threejs.git "$RUNNER_TEMP/img2threejs"
      - name: Install CJK fonts for legible screenshot review
        run: |
          # Network package mirrors occasionally stall for >5 minutes.
          # Visual tests must continue with system font fallback rather than hang.
          if timeout 45s sudo apt-get -o Acquire::Retries=0 update -qq && \
             timeout 70s sudo apt-get -o Acquire::Retries=0 install -y fonts-noto-cjk; then
            echo "CJK fonts installed"
          else
            echo "::warning::CJK font installation timed out; screenshots may use system fallback fonts"
          fi
          fc-cache -f || true
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real geometry and interaction smoke
        run: node scripts/browser-smoke.mjs
      - name: Preserve Chromium screenshots and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhenru-roof-pitch-browser-qa
          path: qa/runtime-screenshots/
          if-no-files-found: ignore
      - name: Run upstream Stage 1 reference image probes
        run: |
          python "$RUNNER_TEMP/img2threejs/forge/stage1_intake/probe_image.py" assets/hall-eaves.jpg
          python "$RUNNER_TEMP/img2threejs/forge/stage1_intake/probe_image.py" assets/temple-interior.jpg
